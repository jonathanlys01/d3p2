# JZ-specific configurations (overrides defaults in config.py)

# Model paths (JZ cluster)
mdlm_model_path: ${oc.env:WORK}/models/kuleshov-group/mdlm-owt/
mdlm_tokenizer: ${oc.env:DSDIR}/HuggingFace_Models/gpt2/

llada_model_path: ${oc.env:WORK}/models/GSAI-ML/LLaDA-8B-Instruct
llada_tokenizer: ${oc.env:WORK}/models/GSAI-ML/LLaDA-8B-Instruct

ar_model_path: ${oc.env:DSDIR}/HuggingFace_Models/meta-llama/Meta-Llama-3-8B/
ar_tokenizer: ${oc.env:DSDIR}/HuggingFace_Models/meta-llama/Meta-Llama-3-8B/

# Eval model paths
ppl_model_id: ${oc.env:DSDIR}/HuggingFace_Models/gpt2-large/
cos_model_id: ${oc.env:WORK}/models/jinaai/jina-embeddings-v2-base-en/

# Data
data_path: ${oc.env:WORK}/data/fineweb-edu/val.bin
initial_mask_ratio: 1.0
single_init: true


# JZ-specific experiment settings (differ from defaults)
seed: 42
n_groups: 2
group_size: 8

cfg_scale: 0.5
block_length: 128

_kernel_type: cosine
_w_interaction: 5.0

subsample_start: 0

n_runs: 8
n_trials: 200  # Optuna sweep trials

interactive: false
