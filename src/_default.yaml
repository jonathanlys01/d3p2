# Default configurations for experiments on JZ

# Paths

# MDLM
# mdlm_model_path: ${env_path_or:WORK,models/kuleshov-group/mdlm-owt/,/SCRATCH/j21lys/models/kuleshov-group/mdlm-owt/}
mdlm_model_path: /Brain/public/models/kuleshov-group/mdlm-owt/
mdlm_tokenizer: ${env_path_or:DSDIR,HuggingFace_Models/gpt2/,gpt2}

# mdlm_model_path: /SCRATCH/j21lys/models/kuleshov-group/mdlm-owt/
# mdlm_tokenizer: gpt2

# LLADA
# llada_model_path: /Brain/public/models/GSAI-ML/LLaDA-8B-Base
# llada_tokenizer: /Brain/public/models/GSAI-ML/LLaDA-8B-Base

llada_model_path: /Brain/public/models/GSAI-ML/LLaDA-8B-Instruct
llada_tokenizer: /Brain/public/models/GSAI-ML/LLaDA-8B-Instruct

ppl_model_id: ${env_path_or:DSDIR,HuggingFace_Models/gpt2/,gpt2}
cos_model_id: ${env_path_or:WORK,models/jinaai/jina-embeddings-v2-base-en/,/Brain/public/models/jinaai/jina-embeddings-v2-base-en/}

# Autoregressive
ar_model_path: /Brain/public/models/meta-llama/Meta-Llama-3-8B/
ar_tokenizer: /Brain/public/models/meta-llama/Meta-Llama-3-8B/

# ar_model_path: gpt2-large
# ar_tokenizer: gpt2-large

data_path: ${env_path_or:WORK,projects/nanoGPT-but-looped/src/data/fineweb-edu/val.bin,/Brain/private/j21lys/nanoGPT-but-looped/src/data/fineweb-edu/val.bin}

seed: 42
cache_dir: ./.cache
n_runs: 8
qa_dataset_len: -1  # number of QA samples to use (-1 for all)
eval_batch_size: 8  # batch size for evaluation (low to avoid OOM with llama 8B)
compile_model: true
mdlm_steps: 1024
cat_temperature: 1.0

# Llada parameters
cfg_scale: 2.5
llada_steps: 128
gen_length: 128
block_length: 128


n_groups: 2
group_size: 2

_kernel_type: cosine
_kernel_power: 1
_w_interaction: 0.0
_w_split: 0.0
_rbf_gamma: 1.0
_temperature: 0.0
_diversity_alpha: 0.0

subsample_start: 0
subsample_end: 1024

method: greedy_map
transversal: True
interactive: false
